<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gorilas Salamanca | Cobranza y Ventas</title><style>
:root{font-family:system-ui,Arial;color:#211b2b;background:#f5f3f8}*{box-sizing:border-box}body{margin:0}header{background:#43216c;color:white;padding:18px 22px}header h1{margin:0;font-size:23px}header small{color:#e7d8f5}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:white;border-bottom:1px solid #ddd}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#562b87;color:white;font-weight:600}nav button{white-space:nowrap;background:#eee8f5;color:#44216e}nav button.active{background:#562b87;color:white}main{max-width:1100px;margin:auto;padding:18px}.panel{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 5px #0001}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.metric{background:#f1eafa;padding:18px;border-radius:12px}.metric strong{display:block;font-size:25px;margin-top:6px}h2{margin-top:0}input,select{padding:11px;border:1px solid #cfc6d7;border-radius:8px;min-width:0;width:100%;font:inherit}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}label{font-size:13px;font-weight:650;display:grid;gap:5px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px;border-bottom:1px solid #e9e4ef;text-align:left;white-space:nowrap}th{background:#f8f5fa}.danger{background:#9e2948}.secondary{background:#ece5f3;color:#44216e}.hidden{display:none}.hint{color:#71677b;font-size:13px}.actions{display:flex;gap:6px}.actions button{padding:7px 10px}.tag{padding:4px 8px;background:#eee8f5;border-radius:20px}footer{text-align:center;padding:20px;color:#786b83}@media print{nav,form,button,.no-print{display:none!important}main{max-width:none}}
</style></head><body><header><h1>🦍 GORILAS SALAMANCA</h1><small>Control de mensualidades, ventas e inventario · MXN</small></header><nav id="nav"></nav><main id="main"></main><footer>Versión inicial · Datos guardados en este navegador · Exporta respaldos periódicamente</footer><script>
const KEY='gorilas_salamanca_v1';const now=()=>new Date().toISOString().slice(0,10);const month=()=>now().slice(0,7);const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem(KEY)||'null')||{config:{fee:350},players:[],charges:[],payments:[],products:[],sales:[],users:[]};let tab='Inicio';const tabs=['Inicio','Jugadores','Mensualidades','Abonos','Ventas','Inventario','Reportes','Configuración'];function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function sum(a){return a.reduce((s,x)=>s+Number(x||0),0)}function balance(c){return Math.max(0,Number(c.amount)-sum(data.payments.filter(p=>p.chargeId===c.id).map(p=>p.amount)))}function player(id){return data.players.find(p=>p.id===id)}function product(id){return data.products.find(p=>p.id===id)}function field(label,name,type='text',other=''){return `<label>${label}<input name="${name}" type="${type}" ${other} required></label>`}function selectField(label,name,items){return `<label>${label}<select name="${name}" required>${items.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></label>`}function formData(f){return Object.fromEntries(new FormData(f))}function show(t){tab=t;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="show('${t}')">${t}</button>`).join('');document.getElementById('main').innerHTML=({Inicio:home,Jugadores:playersView,Mensualidades:chargesView,Abonos:paymentsView,Ventas:salesView,Inventario:inventoryView,Reportes:reportsView,Configuración:settingsView})[tab]()}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}" class="hint">Todavía no hay registros.</td></tr>`}</tbody></table></div>`}function home(){let outstanding=sum(data.charges.map(balance));let paid=sum(data.payments.map(p=>p.amount));let sales=sum(data.sales.map(s=>s.total));return `<div class="cards">${[['Jugadores activos',data.players.filter(p=>p.active).length],['Mensualidades cobradas',money(paid)],['Saldo pendiente',money(outstanding)],['Ventas',money(sales)]].map(x=>`<div class="metric">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><section class="panel"><h2>Bienvenido</h2><p>Registra jugadores, genera los cargos mensuales, acepta abonos y registra ventas. Los saldos se calculan automáticamente.</p><p class="hint">Importante: esta versión guarda los datos únicamente en el navegador actual; no sincroniza equipos ni incluye inicio de sesión real.</p><button onclick="show('Jugadores')">Registrar jugador</button> <button class="secondary" onclick="show('Mensualidades')">Cobrar mensualidades</button></section>`}function playersView(){return `<section class="panel"><h2>Registrar jugador</h2><form onsubmit="addPlayer(event)">${field('Nombre completo','name')}${field('Categoría o equipo','category')}${field('Nombre de tutor (opcional)','guardian','text','')}${field('Teléfono (opcional)','phone','tel','')}<button>Guardar jugador</button></form></section><section class="panel"><h2>Jugadores</h2>${table(['Nombre','Categoría','Tutor','Teléfono','Estado','Acción'],data.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.guardian)}</td><td>${esc(p.phone)}</td><td>${p.active?'Activo':'Inactivo'}</td><td><button class="secondary" onclick="togglePlayer('${p.id}')">${p.active?'Desactivar':'Activar'}</button></td></tr>`))}</section>`}function addPlayer(e){e.preventDefault();let x=formData(e.target);if(!x.name.trim())return;data.players.push({...x,id:uid(),active:true});save()}function togglePlayer(id){let p=player(id);p.active=!p.active;save()}function generate(){let m=document.getElementById('billingMonth').value;if(!m)return alert('Selecciona un mes');let n=0;data.players.filter(p=>p.active).forEach(p=>{if(!data.charges.some(c=>c.playerId===p.id&&c.month===m)){data.charges.push({id:uid(),playerId:p.id,month:m,amount:Number(data.config.fee)});n++}});save();alert(`Se generaron ${n} cargos nuevos.`)}function chargesView(){let rows=data.charges.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(c=>`<tr><td>${esc(player(c.playerId)?.name||'Jugador eliminado')}</td><td>${esc(c.month)}</td><td>${money(c.amount)}</td><td>${money(c.amount-balance(c))}</td><td>${money(balance(c))}</td><td>${balance(c)===0?'Pagado':'Pendiente'}</td><td><button onclick="goPay('${c.id}')" ${balance(c)===0?'disabled':''}>Abonar</button></td></tr>`);return `<section class="panel"><h2>Generar mensualidades</h2><p>Cuota fija: <b>${money(data.config.fee)}</b>. Los cargos no se duplican para un mismo jugador y mes.</p><label style="max-width:240px">Mes a cobrar<input id="billingMonth" type="month" value="${month()}"></label><p><button onclick="generate()">Generar cargos del mes</button></p></section><section class="panel"><h2>Estado de mensualidades</h2>${table(['Jugador','Mes','Cuota','Abonado','Saldo','Estado',''],rows)}</section>`}let selectedCharge='';function goPay(id){selectedCharge=id;show('Abonos')}function paymentsView(){let pending=data.charges.filter(c=>balance(c)>0);return `<section class="panel"><h2>Registrar abono o pago</h2><form onsubmit="addPayment(event)">${selectField('Mensualidad pendiente','chargeId',pending.map(c=>[c.id,`${player(c.playerId)?.name||'Jugador'} · ${c.month} · saldo ${money(balance(c))}`]))}${field('Importe (MXN)','amount','number','min="0.01" step="0.01"')}${field('Fecha','date','date',`value="${now()}"`)}${selectField('Método','method',[['Efectivo','Efectivo'],['Transferencia','Transferencia'],['Otro','Otro']])}${field('Referencia / nota','note','text','')}<button ${pending.length?'':'disabled'}>Registrar pago</button></form></section><section class="panel"><h2>Historial de pagos</h2>${table(['Fecha','Jugador','Mes','Importe','Método','Referencia'],data.payments.slice().reverse().map(p=>{let c=data.charges.find(c=>c.id===p.chargeId);return `<tr><td>${esc(p.date)}</td><td>${esc(player(c?.playerId)?.name||'—')}</td><td>${esc(c?.month||'—')}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.note)}</td></tr>`}))}</section>`}function addPayment(e){e.preventDefault();let x=formData(e.target);let c=data.charges.find(c=>c.id===x.chargeId);let a=Number(x.amount);if(!c||!Number.isFinite(a)||a<=0||a>balance(c))return alert('Importe inválido o mayor al saldo pendiente');data.payments.push({...x,id:uid(),amount:a});save()}function inventoryView(){return `<section class="panel"><h2>Agregar artículo</h2><form onsubmit="addProduct(event)">${field('Artículo','name')}${field('Precio de venta (MXN)','price','number','min="0" step="0.01"')}${field('Existencia inicial','stock','number','min="0" step="1"')}<button>Guardar artículo</button></form></section><section class="panel"><h2>Inventario</h2>${table(['Artículo','Precio','Existencias','Ajustar inventario'],data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td class="actions"><button class="secondary" onclick="adjustStock('${p.id}',1)">+1</button><button class="secondary" onclick="adjustStock('${p.id}',-1)" ${p.stock<=0?'disabled':''}>−1</button></td></tr>`))}</section>`}function addProduct(e){e.preventDefault();let x=formData(e.target);data.products.push({id:uid(),name:x.name,price:Number(x.price),stock:Number(x.stock)});save()}function adjustStock(id,n){let p=product(id);if(p.stock+n<0)return;p.stock+=n;save()}function salesView(){return `<section class="panel"><h2>Nueva venta</h2><form onsubmit="addSale(event)">${selectField('Artículo','productId',data.products.filter(p=>p.stock>0).map(p=>[p.id,`${p.name} · ${money(p.price)} · ${p.stock} disponibles`]))}${field('Cantidad','quantity','number','min="1" step="1" value="1"')}${field('Fecha','date','date',`value="${now()}"`)}${selectField('Método de pago','method',[['Efectivo','Efectivo'],['Transferencia','Transferencia'],['Otro','Otro']])}${field('Cliente (opcional)','customer')}<button ${data.products.some(p=>p.stock>0)?'':'disabled'}>Registrar venta</button></form></section><section class="panel"><h2>Historial de ventas</h2>${table(['Fecha','Artículo','Cantidad','Total','Método','Cliente'],data.sales.slice().reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.productName)}</td><td>${s.quantity}</td><td>${money(s.total)}</td><td>${esc(s.method)}</td><td>${esc(s.customer)}</td></tr>`))}</section>`}function addSale(e){e.preventDefault();let x=formData(e.target),p=product(x.productId),q=Number(x.quantity);if(!p||!Number.isInteger(q)||q<1||q>p.stock)return alert('Cantidad inválida o inventario insuficiente');p.stock-=q;data.sales.push({...x,id:uid(),quantity:q,unitPrice:p.price,productName:p.name,total:q*p.price});save()}function reportsView(){let monthly={};for(let p of data.payments){let m=p.date.slice(0,7);monthly[m]??={payments:0,sales:0};monthly[m].payments+=p.amount}for(let s of data.sales){let m=s.date.slice(0,7);monthly[m]??={payments:0,sales:0};monthly[m].sales+=s.total}return `<section class="panel"><h2>Resumen financiero</h2><div class="cards">${[['Cobranza de mensualidades',money(sum(data.payments.map(p=>p.amount)))],['Ventas registradas',money(sum(data.sales.map(s=>s.total)))],['Ingreso total',money(sum(data.payments.map(p=>p.amount))+sum(data.sales.map(s=>s.total)))],['Cuentas por cobrar',money(sum(data.charges.map(balance)))]].map(x=>`<div class="metric">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div></section><section class="panel"><h2>Ingresos por mes</h2>${table(['Mes','Mensualidades','Ventas','Total'],Object.keys(monthly).sort().reverse().map(m=>`<tr><td>${m}</td><td>${money(monthly[m].payments)}</td><td>${money(monthly[m].sales)}</td><td>${money(monthly[m].payments+monthly[m].sales)}</td></tr>`))}<p><button onclick="window.print()">Imprimir reporte / Guardar PDF</button></p></section>`}function settingsView(){return `<section class="panel"><h2>Configuración</h2><form onsubmit="setFee(event)">${field('Cuota mensual fija (MXN)','fee','number',`min="0" step="0.01" value="${data.config.fee}"`)}<button>Actualizar cuota</button></form><p class="hint">La nueva cuota se aplica solo a los cargos que se generen después del cambio.</p></section><section class="panel"><h2>Respaldos</h2><p>Exporta una copia de tus registros en formato JSON. Puedes restaurarla en este navegador.</p><button onclick="exportData()">Descargar respaldo</button> <label style="margin-top:12px">Restaurar respaldo JSON<input type="file" accept="application/json,.json" onchange="importData(event)"></label></section><section class="panel"><h2>Acceso para varios administradores</h2><p>Esta demostración no tiene autenticación ni sincronización. Para el uso real en varios celulares y computadoras será necesario implementar cuentas, permisos, base de datos y respaldos seguros.</p></section>`}function setFee(e){e.preventDefault();let n=Number(formData(e.target).fee);if(n<0||!Number.isFinite(n))return;data.config.fee=n;save()}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`gorilas-respaldo-${now()}.json`;a.click();URL.revokeObjectURL(url)}async function importData(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.players)||!Array.isArray(d.charges)||!Array.isArray(d.payments)||!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.config)throw Error('Formato inválido');if(!confirm('¿Reemplazar todos los registros actuales con este respaldo?'))return;data=d;save()}catch(err){alert('No se pudo restaurar: '+err.message)}}render();
</script></body></html>
