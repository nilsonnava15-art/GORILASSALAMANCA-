function addExtra(e){e.preventDefault();let x=formData(e.target),a=Number(x.amount);if(!Number.isFinite(a)||a<=0)return alert('Importe inválido');let players=x.target==='all'?data.players.filter(p=>p.active):data.players.filter(p=>p.active&&p.id===x.target);if(!players.length)return alert('No hay jugadores seleccionados');if(!confirm(`¿Crear ${players.length} cargos de ${money(a)} por ${x.type}?`))return;for(let p of players)data.extraCharges.push({id:uid(),playerId:p.id,type:x.type,description:x.description,amount:a,dueDate:x.dueDate});save()}

let selectedAccount='';
function sendAccountWhatsApp(){let p=player(selectedAccount);if(!p)return alert('Selecciona un jugador');let charges=data.charges.filter(c=>c.playerId===p.id).map(c=>({concept:'Mensualidad '+c.month,amount:Number(c.amount),paid:sum(data.payments.filter(x=>x.chargeId===c.id).map(x=>x.amount))}));let extras=data.extraCharges.filter(c=>c.playerId===p.id).map(c=>({concept:c.type+' · '+c.description,amount:Number(c.amount),paid:sum(data.extraPayments.filter(x=>x.chargeId===c.id).map(x=>x.amount))}));let all=[...charges,...extras],total=sum(all.map(c=>c.amount)),paid=sum(all.map(c=>c.paid)),due=Math.max(0,total-paid);let detail=all.map(c=>'• '+c.concept+': cargo '+money(c.amount)+' | abonado '+money(c.paid)+' | pendiente '+money(Math.max(0,c.amount-c.paid))).join('\n');let message='🏈 GORILAS SALAMANCA\nEstado de cuenta de '+p.name+'\nFecha: '+now()+'\n\n'+(detail||'Sin cargos registrados.')+'\n\nTotal de cargos: '+money(total)+'\nTotal pagado: '+money(paid)+'\nSaldo pendiente: '+money(due)+'\n\nPara cualquier aclaración, comunícate con la administración de Gorilas Salamanca.';let phone=String(p.phone||'').replace(/\D/g,'');if(phone.length===10)phone='52'+phone;let url='https://wa.me/'+(phone.length>=11?phone:'')+'?text='+encodeURIComponent(message);window.open(url,'_blank','noopener,noreferrer')||alert('Permite abrir ventanas emergentes para compartir por WhatsApp.')}
function printAccount(){let p=player(selectedAccount);if(!p)return;let charges=data.charges.filter(c=>c.playerId===p.id).map(c=>({label:'Mensualidad '+c.month,amount:c.amount,paid:sum(data.payments.filter(x=>x.chargeId===c.id).map(x=>x.amount))}));let extras=data.extraCharges.filter(c=>c.playerId===p.id).map(c=>({label:c.type+' · '+c.description,amount:c.amount,paid:sum(data.extraPayments.filter(x=>x.chargeId===c.id).map(x=>x.amount))}));let all=[...charges,...extras];let rows=all.map(c=>`<tr><td>${esc(c.label)}</td><td>${money(c.amount)}</td><td>${money(c.paid)}</td><td>${money(Math.max(0,c.amount-c.paid))}</td></tr>`).join('');let html=`<!doctype html><html lang="es"><meta charset="utf-8"><title>Estado de cuenta Gorilas Salamanca</title><style>body{font:15px Arial;max-width:800px;margin:24px auto;padding:16px}header{display:flex;align-items:center;gap:16px;border-bottom:3px solid #63328e}img{width:95px;height:95px;object-fit:contain}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{border-bottom:1px solid #ccc;text-align:left;padding:9px}h2{color:#63328e}@media print{button{display:none}}</style><header><img src="${LOGO}"><div><h2>GORILAS SALAMANCA</h2>Estado de cuenta individual</div></header><p><b>Jugador:</b> ${esc(p.name)} · ${esc(p.category)}</p><p><b>Fecha de emisión:</b> ${now()}</p><table><thead><tr><th>Concepto</th><th>Cargo</th><th>Abonado</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table><h3>Total de cargos: ${money(sum(all.map(c=>c.amount)))}</h3><h3>Total pagado: ${money(sum(all.map(c=>c.paid)))}</h3><h2>Saldo pendiente: ${money(sum(all.map(c=>Math.max(0,c.amount-c.paid))))}</h2><button onclick="window.print()">Imprimir / Guardar PDF</button></html>`;let w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir');w.document.write(html);w.document.close()}

render();
